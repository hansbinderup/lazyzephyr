[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyzephyr"
version = "0.1.0"
description = "lazygit-style TUI for Zephyr: twister tests and the devicetree"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "watchfiles>=0.21",
    "PyYAML>=6.0",
    "pyte>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lazyzephyr = "lazyzephyr.launcher:main"

[tool.setuptools]
packages = ["lazyzephyr", "lazyzephyr.builder", "lazyzephyr.dts", "lazyzephyr.kconfig",
            "lazyzephyr.twister"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
