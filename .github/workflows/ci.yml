# Checks every pull request into main: the test suite on each supported
# Python and several Zephyr versions, and ruff lint and format.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Two axes, following the Python versions each Zephyr release supports
  # (its own CI). How to update them: docs/development.md.
  python:
    name: Python ${{ matrix.python }} / Zephyr ${{ matrix.zephyr }}
    strategy:
      fail-fast: false
      matrix:
        # Each Python lazyzephyr supports, against the newest Zephyr release
        # that supports that Python.
        include:
          - { python: "3.12", zephyr: v4.5.0 }
          - { python: "3.13", zephyr: v4.5.0 }
          - { python: "3.14", zephyr: v4.5.0 }
    uses: ./.github/workflows/test.yml
    with:
      python: ${{ matrix.python }}
      zephyr: ${{ matrix.zephyr }}

  zephyr:
    name: Zephyr ${{ matrix.zephyr }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        # The other Zephyr releases on Python 3.12, which all of them support.
        # main is reported but doesn't fail the PR; nightly.yml checks it too.
        zephyr: [v4.2.2, v4.3.2, v4.4.2, main]
    uses: ./.github/workflows/test.yml
    with:
      python: "3.12"
      zephyr: ${{ matrix.zephyr }}
      allow-failure: ${{ matrix.zephyr == 'main' }}

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        # Pinned, so a new ruff release can't turn a passing PR red. Keep it
        # in step with the ruff from flake.lock and required-version in
        # pyproject.toml.
        run: python -m pip install ruff==0.17.4
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        if: ${{ !cancelled() }}
        run: ruff format --check --diff .
